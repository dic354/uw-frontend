<!-- ─── OVERLAY ────────────────────────────────────────────── -->
<div class="drawer-overlay" [class.open]="drawerOpen" (click)="closeDrawer()"></div>

<!-- ─── DRAWER LATERAL ────────────────────────────────────── -->
<aside class="side-drawer" [class.open]="drawerOpen">

    <!-- Cabecera del drawer -->
    <div class="drawer-header">
        <span class="drawer-title">Menú</span>
        <button class="drawer-close-btn" (click)="closeDrawer()" aria-label="Cerrar menú">
            <i class="bi bi-x-lg"></i>
        </button>
    </div>

    <div class="drawer-divider"></div>

    <!-- Contenido del drawer -->
    <nav class="drawer-nav">
        <ul class="drawer-menu">

            <!-- Inicio -->
            <li class="drawer-item">
                <button class="drawer-link" (click)="navigateTo('/')">
                    Inicio
                </button>
            </li>

            <!-- Catálogo con subcategorías -->
            <li class="drawer-item">
                <button class="drawer-link drawer-link--arrow" (click)="toggleCategorias()">
                    Catálogo
                    <i class="bi" [class.bi-chevron-right]="!categoriasExpanded" [class.bi-chevron-down]="categoriasExpanded"></i>
                </button>

                <!-- Sub-lista de categorías -->
                <div class="drawer-subcats" [class.expanded]="categoriasExpanded">
                    <ul>
                        <!-- Todos los productos -->
                        <li>
                            <button class="drawer-sublink drawer-sublink--all" (click)="navigateTo('/catalogo')">
                                Todos los productos
                            </button>
                        </li>
                        <!-- Categorías dinámicas CORREGIDAS -->
                        <li *ngFor="let cat of categorias">
                            <button class="drawer-sublink" (click)="navigateTo('/catalogo', { categoriaId: cat.id })">
                                {{ cat.nombre }}
                            </button>
                        </li>
                    </ul>
                </div>
            </li>

            <!-- Contacto -->
            <li class="drawer-item">
                <button class="drawer-link" (click)="navigateTo('/contacto')">
                    Contacto
                </button>
            </li>

        </ul>

        <div class="drawer-divider"></div>

        <!-- Sección de usuario -->
        <ul class="drawer-menu drawer-menu--user">

            <!-- Carrito -->
            <li class="drawer-item">
                <button class="drawer-link drawer-link--icon" (click)="navigateTo('/carrito')">
                    <i class="bi bi-bag"></i>
                    Carrito
                    <ng-container *ngIf="totalItems$ | async as total">
                        <span *ngIf="total > 0" class="drawer-badge">{{ total }}</span>
                    </ng-container>
                </button>
            </li>

            <!-- Sin sesión -->
            <ng-container *ngIf="!(usuario$ | async)">
                <li class="drawer-item">
                    <button class="drawer-link drawer-link--icon" (click)="navigateTo('/auth/login')">
                        <i class="bi bi-person"></i>
                        Iniciar sesión
                    </button>
                </li>
            </ng-container>

            <!-- Con sesión -->
            <ng-container *ngIf="usuario$ | async as usuario">
                <li class="drawer-item">
                    <button class="drawer-link drawer-link--icon" (click)="navigateTo('/perfil')">
                        <i class="bi bi-person-circle"></i>
                        Mi perfil
                    </button>
                </li>
                <li class="drawer-item" *ngIf="usuario.rol === 'administrador'">
                    <button class="drawer-link drawer-link--icon" (click)="navigateTo('/admin')">
                        <i class="bi bi-gear"></i>
                        Panel Admin
                    </button>
                </li>
                <li class="drawer-item">
                    <button class="drawer-link drawer-link--icon drawer-link--danger" (click)="logout()">
                        <i class="bi bi-box-arrow-right"></i>
                        Cerrar sesión
                    </button>
                </li>
            </ng-container>

        </ul>
    </nav>
</aside>
